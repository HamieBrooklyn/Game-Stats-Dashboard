# launchd opens a service's log once, when it starts it. So after rotating a service's log, newsyslog stops it
# (signal 15 to its pid file) and launchd starts it again on the new file: the collector for a moment, the
# tunnel for a few seconds. The update job is a new process every run, so its log needs no signal (N).
# logfilename                          [owner:group]  mode count size(KB) when  flags  [/pid_file]  [sig]
__ROOT__/logs/collector.log            __USER__:staff 644  7     10240    *     J      __ROOT__/collector/data/collector.pid  15
__ROOT__/logs/tunnel.log               __USER__:staff 644  3     2048     *     J      __ROOT__/logs/tunnel.pid  15
__ROOT__/logs/update.log               __USER__:staff 644  3     2048     *     JN
