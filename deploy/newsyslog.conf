# launchd opens a service's log once, when it starts it. So after rotating the collector's log, newsyslog stops
# the collector (signal 15 to its pid file) and launchd starts it again on the new file. The tunnel logs only
# warnings, so its file stays small and is rotated without a restart (a few lines can land in the old file).
# logfilename                          [owner:group]  mode count size(KB) when  flags  [/pid_file]  [sig]
__ROOT__/logs/collector.log            __USER__:staff 644  7     10240    *     J      __ROOT__/collector/data/collector.pid  15
__ROOT__/logs/tunnel.log               __USER__:staff 644  3     2048     *     J
__ROOT__/logs/update.log               __USER__:staff 644  3     2048     *     J
