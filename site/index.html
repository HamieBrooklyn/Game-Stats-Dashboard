<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'">
  <title>Game Stats</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/theme-init.js"></script>
  <script src="config.js"></script>
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Pages">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M4 18V12M10 18V6M16 18v-8M22 18H2"/></svg></span>
        Game Stats
      </div>
      <a class="nav-item" href="#/overview" data-page="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Overview</span>
      </a>
      <a class="nav-item" href="#/funnels" data-page="funnels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>
        <span>Funnels</span>
      </a>
      <a class="nav-item" href="#/money" data-page="money">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v1.5M12 16v1.5"/></svg>
        <span class="wide-only">Monetization</span><span class="phone-only-label">Money</span>
      </a>
      <a class="nav-item" href="#/live" data-page="live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>Live</span>
      </a>
      <a class="nav-item" href="#/feedback" data-page="feedback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Feedback</span>
      </a>
      <a class="nav-item" href="#/people" data-page="people" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        <span>People</span>
      </a>
      <div class="sidebar-foot">
        <span class="who" id="who"></span>
        <span class="status" id="connection"><span class="dot pending"></span>Connecting…</span>
        <button class="nav-item" type="button" id="sign-out" style="height:28px;padding:0">Sign out</button>
      </div>
    </nav>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Overview</h1>
        <label class="sr-only" for="game">Game</label>
        <select class="select" id="game"></select>
        <div class="segmented" id="range" role="group" aria-label="Time range">
          <button type="button" data-range="24h" aria-pressed="false">24h</button>
          <button type="button" data-range="7d" aria-pressed="true">7d</button>
          <button type="button" data-range="30d" aria-pressed="false">30d</button>
        </div>
        <span class="spacer"></span>
        <span class="status" id="as-of"></span>
        <button class="button icon-button" type="button" id="refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="button icon-button" type="button" id="theme" aria-label="Theme: system"></button>
        <button class="button icon-button phone-only" type="button" id="sign-out-top" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </header>
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="sign-in">
    <h2 id="sign-in-title">Sign in</h2>
    <p class="note" id="sign-in-note">Sign in with your Roblox account. Roblox asks which experiences to share: pick the games you work on.</p>
    <p class="note error" id="sign-in-error" role="alert" hidden></p>
    <a class="button primary" id="roblox-sign-in" href="/auth/roblox" hidden>Sign in with Roblox</a>
    <details class="secret-sign-in" id="secret-box">
      <summary>Owner: use the dashboard secret</summary>
      <form method="dialog" id="sign-in-form">
        <label class="sr-only" for="secret">Secret</label>
        <input class="input" id="secret" type="password" autocomplete="current-password" placeholder="Secret" required>
        <button class="button" type="submit">Sign in with the secret</button>
      </form>
    </details>
  </dialog>
</body>
</html>
