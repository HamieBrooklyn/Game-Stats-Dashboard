# The collector's tests (parity with the in-game panel's math, and the API end to end) on every push and PR.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/*.test.js
        working-directory: collector
      - name: Updater reads PORT like the collector (under set -euo pipefail)
        run: bash deploy/test-update-port.sh
